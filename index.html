    // 工具函式：Google Maps 單點搜尋與多點串聯導航 URL 產生器

    function getMapsUrl(query) {
      return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query)}`;
    }

    function getMultiStopRouteUrl(stops) {
      if (!stops || stops.length < 2) return getMapsUrl(stops?.[0]?.query || "南港國宅");
      const origin = encodeURIComponent(stops[0].query);
      const destination = encodeURIComponent(stops[stops.length - 1].query);
      const waypoints = stops.slice(1, -1).map(s => encodeURIComponent(s.query)).join('|');
      let url = `https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${destination}&travelmode=driving`;
      if (waypoints) {
        url += `&waypoints=${waypoints}`;
      }
      return url;
    }

                  <!-- Day 3：南迴/池上 -->
                  <circle cx="176" cy="345" r="5" fill="#38BDF8" />
                  <text x="186" y="352" fill="#38BDF8" font-size="10" font-weight="bold">南迴・多良・金崙</text>
                  <circle cx="195" cy="272" r="6" fill="#E5C17B" />
                  <text x="205" y="275" fill="#E5C17B" font-size="10" font-weight="bold">D3 池上禮物盒子</text>

                  <!-- Day 4：栗松/石梯坪/花蓮 -->
                  <circle cx="172" cy="252" r="5" fill="#FB7185" />
                  <text x="115" y="255" fill="#FB7185" font-size="10" font-weight="bold">栗松溫泉</text>
                  <circle cx="222" cy="145" r="6" fill="#E5C17B" />
                  <text x="232" y="143" fill="#E5C17B" font-size="10" font-weight="bold">D4 七星潭飯店</text>

                  <!-- Day 5：清水斷崖/不厭亭 -->
                  <circle cx="233" cy="82" r="5" fill="#38BDF8" />

              </div>

              <!-- 右側：全環島分段 Google Maps 一鍵多點導航 -->
              <div class="lg:col-span-7 space-y-4">
                <h3 class="text-lg font-black text-white">🚗 全環島雙半圈 Google Maps 多點導航</h3>
                <p class="text-xs sm:text-sm text-slate-300 leading-relaxed">
                  由於單次 Google Maps 多點導航上限為 10 個停靠點，已為您將整趟 1,034 公里環島拆分為<strong>「上半圈（西岸南下段）」</strong>與<strong>「下半圈（南迴花東返北段）」</strong>，直接點擊即可開啟完整路線預覽：
                </p>

                <div class="p-4 rounded-2xl bg-black/30 border border-white/10 space-y-2">
                  <div class="flex items-center justify-between">
                    <span class="text-xs font-bold text-champagne">前半圈：Day 1 – Day 2（約 428 km）</span>
                    <span class="text-[11px] text-slate-400">南港國宅 ➔ 西岸 ➔ 彰化婚禮 ➔ 高雄 ➔ 屏東</span>
                  </div>
                  <p class="text-xs text-slate-300">南港國宅 ➔ 好望角 ➔ 通霄日落大道 ➔ 鰲峰山 ➔ 高美濕地 ➔ 八卦山 ➔ 唯愛庭園 ➔ 棧貳庫 ➔ 高流 ➔ 哈囉行旅屏東館</p>
                  <a href="${westCoastUrl}" target="_blank" rel="noopener noreferrer"
                     class="inline-flex items-center gap-2 px-4 py-2 rounded-xl text-xs font-black bg-cobalt hover:bg-sky-300 text-obsidian transition">
                    <span>🗺️ 開啟前半圈 Google Maps 完整路線 ↗</span>
                  </a>

                <div class="p-4 rounded-2xl bg-black/30 border border-white/10 space-y-2">
                  <div class="flex items-center justify-between">
                    <span class="text-xs font-bold text-emerald-300">後半圈：Day 3 – Day 5（約 606 km）</span>
                    <span class="text-[11px] text-slate-400">屏東 ➔ 南迴 ➔ 池上 ➔ 花蓮 ➔ 東北角 ➔ 南港國宅</span>
                  </div>
                  <p class="text-xs text-slate-300">哈囉行旅屏東館 ➔ 多良車站 ➔ 華源海灣 ➔ 池上萬安磚窯廠 ➔ 大坡池 ➔ 玉長公路 ➔ 石梯坪 ➔ 牛山呼庭 ➔ 七星潭泊區 ➔ 清水斷崖 ➔ 不厭亭 ➔ 南港國宅</p>
                  <a href="${eastCoastUrl}" target="_blank" rel="noopener noreferrer"
                     class="inline-flex items-center gap-2 px-4 py-2 rounded-xl text-xs font-black bg-emerald-400 hover:bg-emerald-300 text-obsidian transition">
                    <span>🗺️ 開啟後半圈 Google Maps 完整路線 ↗</span>

          <!-- 每日里程與路線佔比明細 -->
          <div class="space-y-3.5">

      `;
    }

    // =========================================================================
    // 渲染行前裝備與四晚住宿總覽頁面
    // =========================================================================
    const checklistGroups = [
      {
        title: "🏎️ 愛車長途檢查與攝影器材",
        items: [
          "出發前檢查胎壓、胎紋深度、機油與冷卻水水位、雨刷精",
          "車身清潔用品：超細纖維擦車布 2–3 條、快速細節噴霧（海邊拍車前擦拭鹽分水漬）",
          "穩固型三腳架（Day 5 七星潭泊區錄製 40 分鐘日出縮時必備）",
          "相機／手機充足電池、行動電源、車用快充線與大容量記憶卡",
          "行車記錄器記憶卡格式化確認（金崙大橋、蘇花改動態追焦用）"
        ]
      },
      {
        title: "♨️ 栗松野溪溫泉專屬裝備（Day 4 重點）",
        items: [
          "確認已預約池上／利稻當地 4x4 接駁車與接送時間（06:30 出發）",
          "高止滑度溯溪鞋或防滑登山鞋（岩壁濕滑與涉水渡溪必備）",
          "防滑工作手套（拉繩陡下與攀爬大石壁保護雙手）",
          "20L 以上防水背包或防水袋（保護手機、相機、毛巾與乾衣物）",
          "泳衣／快乾運動衣褲、大條吸水快乾毛巾、整套乾淨換洗衣物與保暖防風外套"
        ]
      },
      {
        title: "👔 婚禮穿搭與 12 月初環島衣物",
        items: [
          "Day 2（12/5）彰化唯愛庭園婚禮正式／半正式服裝與皮鞋／休閒皮鞋",
          "12 月初「北涼南暖」洋蔥式穿搭：發熱衣、薄長袖、防風羽絨或夾克外套",
          "太陽眼鏡（Day 1 中午西濱與 Day 3 上午南迴正順光駕駛必備）",
          "個人常備藥品、暈車藥（南橫與 102 縣道山路備用）、健保卡與身分證"
        ]
      }
    ];

    let checkedState = {};

    function toggleCheck(key) {
      checkedState[key] = !checkedState[key];
      renderChecklist();
    }

    function renderChecklist() {
      const container = document.getElementById('app-content');

      const hotelsSummary = [
        { day: "Day 1 · 12/4 (五)", city: "彰化市", name: "Timios Inn. 提米好旅", address: "彰化市成功路277號", status: "已確認預訂", statusClass: "text-emerald-300 bg-emerald-500/15 border-emerald-500/30", query: "Timios Inn. 提米好旅 彰化市成功路277號" },
        { day: "Day 2 · 12/5 (六)", city: "屏東市", name: "Hello inn 哈囉行旅屏東館", address: "屏東市瑞民路6號1樓", status: "已確認預訂", statusClass: "text-emerald-300 bg-emerald-500/15 border-emerald-500/30", query: "Hello inn 哈囉行旅屏東館 屏東縣屏東市瑞民路6號" },
        { day: "Day 3 · 12/6 (日)", city: "台東池上", name: "禮物盒子青年旅館", address: "台東縣池上鄉忠孝路89號", status: "已確認預訂", statusClass: "text-emerald-300 bg-emerald-500/15 border-emerald-500/30", query: "禮物盒子民宿 台東縣池上鄉忠孝路89號" },
        { day: "Day 4 · 12/7 (一)", city: "花蓮新城", name: "七星潭渡假飯店", address: "花蓮縣新城鄉明潭街10號", status: "已確認預訂", statusClass: "text-emerald-300 bg-emerald-500/15 border-emerald-500/30", query: "七星潭渡假飯店 花蓮縣新城鄉明潭街10號" }
      ];

      const hotelsHtml = hotelsSummary.map(h => `
        <div class="glass-panel rounded-2xl p-4 border border-white/10 flex flex-col justify-between">
          <div>
            <div class="flex items-center justify-between gap-2">
              <span class="text-xs font-bold text-champagne">${h.day} · ${h.city}</span>
              <span class="px-2 py-0.5 rounded-full text-[11px] font-bold border ${h.statusClass}">${h.status}</span>
            </div>
            <h4 class="text-base font-bold text-white mt-1.5">${h.name}</h4>
            <p class="text-xs text-slate-400 mt-1">📍 ${h.address}</p>
          </div>
          <div class="mt-3 pt-3 border-t border-white/5">
            <a href="${getMapsUrl(h.query)}" target="_blank" rel="noopener noreferrer"
               class="inline-flex items-center gap-1.5 text-xs font-bold text-cobalt hover:text-sky-300 transition">
              <span>🗺️ Google Maps 導航</span>
              <span>→</span>
            </a>
          </div>
        </div>
      `).join('');

      const groupsHtml = checklistGroups.map((group, gIdx) => {
        const itemsHtml = group.items.map((text, iIdx) => {
          const key = `${gIdx}-${iIdx}`;
          const isChecked = !!checkedState[key];
          return `
            <button type="button" onclick="toggleCheck('${key}')"
                    class="w-full text-left flex items-start gap-3 p-3 rounded-xl transition border ${isChecked ? 'bg-emerald-500/10 border-emerald-500/30 text-slate-400 line-through' : 'bg-black/25 hover:bg-black/40 border-white/5 text-slate-200'}">
              <span class="mt-0.5 w-5 h-5 rounded-md flex items-center justify-center shrink-0 border ${isChecked ? 'bg-emerald-500 border-emerald-400 text-obsidian font-bold' : 'border-slate-500'}">
                ${isChecked ? '✓' : ''}
              </span>
              <span class="text-xs sm:text-sm leading-relaxed">${text}</span>
            </button>
          `;
        }).join('');

        return `
          <div class="glass-panel gold-gradient-border rounded-2xl p-5">
            <h3 class="text-base font-bold text-white mb-3">${group.title}</h3>
            <div class="space-y-2">
              ${itemsHtml}
            </div>
          </div>
        `;
      }).join('');

      container.innerHTML = `
        <section class="animate-fadeIn">
          <div class="mb-6">
            <div class="text-xs font-black tracking-widest text-champagne uppercase">ACCOMMODATION &amp; PRE-TRIP GEAR</div>
            <h2 class="text-xl sm:text-3xl font-black text-white mt-1">四晚住宿總覽 ＆ 環島行前檢查清單</h2>
            <p class="text-sm text-slate-400 mt-1">四晚住宿已全數確認！下方裝備清單可直接點擊勾選確認準備進度。</p>
          </div>

          <div class="mb-8">
            <h3 class="text-sm font-bold uppercase tracking-wider text-purple-300 mb-3">🏨 四晚住宿總覽</h3>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3.5">
              ${hotelsHtml}
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            ${groupsHtml}
          </div>
        </section>
      `;
    }

    // =========================================================================
    // 分頁切換控制與初始化
    // =========================================================================
    function switchTab(tabName) {
      document.querySelectorAll('.tab-btn').forEach(btn => {
        if (btn.dataset.tab === tabName) {
          btn.className = "tab-btn shrink-0 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-black bg-champagne text-obsidian shadow-lg shadow-champagne/20 transition-all";
        } else {
          btn.className = "tab-btn shrink-0 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold text-slate-300 hover:text-white hover:bg-white/10 transition-all";
        }
      });

      if (tabName === 'checklist') {
        renderChecklist();
      } else if (tabName === 'overview') {
        renderOverview();
      } else {
        renderDay(tabName);
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // 初始化預設顯示 Day 1
    window.addEventListener('DOMContentLoaded', () => {
      switchTab('day1');
    });
  </script>
</body>
