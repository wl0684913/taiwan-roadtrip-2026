              ${item.description}
            </p>

            <!-- 拍車技巧 & 地點歷史／推薦體驗活動 雙欄卡片 -->
            <div class="mt-4 grid grid-cols-1 md:grid-cols-2 gap-3">
              <div class="p-3.5 rounded-xl bg-obsidian/70 border border-champagne/20">
                <div class="text-xs font-bold text-champagne flex items-center gap-1.5 mb-1.5">
                  <span>📸 拍車與賞景機位重點</span>
                </div>
                <p class="text-xs text-slate-300 leading-relaxed">${item.photoTip}</p>
              </div>
              <div class="p-3.5 rounded-xl bg-obsidian/70 border border-cobalt/25">
                <div class="text-xs font-bold text-cobalt flex items-center gap-1.5 mb-1.5">
                  <span>🏛️ 地點歷史故事 ＆ 推薦體驗活動</span>
                </div>
                <p class="text-xs text-slate-300 leading-relaxed">${item.historyOrActivity}</p>
              </div>
            </div>

            <!-- IG 熱門實景美照展示區塊與連結 -->
            <div class="mt-4 rounded-xl overflow-hidden bg-obsidian/90 border border-white/10">
              <div class="relative aspect-[16/9] sm:aspect-[21/9] w-full overflow-hidden bg-slate-900">
                <img
                  src="${item.igPhoto}"
                  alt="${item.title} 實景美照"
                  loading="lazy"
                  onerror="this.onerror=null;this.src='https://placehold.co/1000x450/131822/E5C17B?text=Instagram+Spot+Showcase';"
                  class="w-full h-full object-cover object-center transition-transform duration-500 group-hover:scale-105"
                />
                <div class="absolute inset-0 bg-gradient-to-t from-obsidian via-obsidian/25 to-transparent"></div>
                <div class="absolute top-3 left-3">
                  <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-[11px] font-bold bg-black/60 backdrop-blur-md text-pink-300 border border-pink-500/30">
                    📷 IG 實景參考大片
                  </span>
                </div>
                <div class="absolute bottom-3 left-3 right-3 flex flex-wrap items-center justify-between gap-2">
                  <span class="text-xs font-medium text-slate-200 drop-shadow">
                    ${item.igCaption}
                  </span>
                  <a href="${item.igUrl}" target="_blank" rel="noopener noreferrer"
                     class="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-xl text-xs font-bold bg-gradient-to-r from-pink-500 via-rose-500 to-amber-500 text-white shadow-lg shadow-pink-500/25 hover:opacity-95 transition">
                    <span>查看 Instagram 打卡美照 (${item.igTag}) ↗</span>
                  </a>
                </div>
              </div>
            </div>
          </div>
        </div>
      `).join('');

      const extensionsHtml = data.nearbyExtensions.map(ext => `
        <div class="p-4 rounded-2xl bg-carbon border border-white/10 hover:border-champagne/40 transition flex flex-col justify-between">
          <div>
            <div class="flex items-center justify-between gap-2 mb-2">
              <span class="px-2.5 py-0.5 rounded-md text-[11px] font-bold bg-cobalt/15 text-cobalt border border-cobalt/30">
                ${ext.category}
              </span>
            </div>
            <h4 class="text-base font-bold text-white">${ext.name}</h4>
            <p class="mt-1.5 text-xs text-slate-400 leading-relaxed">${ext.desc}</p>
          </div>
          <div class="mt-4 pt-3 border-t border-white/5">
            <a href="${getMapUrl(ext.query)}" target="_blank" rel="noopener noreferrer"
               class="inline-flex items-center gap-1.5 text-xs font-semibold text-champagne hover:underline">
              <span>📍 開啟 Google Maps 查看位置 ➔</span>
            </a>
          </div>
        </div>
      `).join('');

      const dayKeys = ['day1', 'day2', 'day3', 'day4', 'day5'];
      const currentIndex = dayKeys.indexOf(dayKey);
      const prevDay = currentIndex > 0 ? dayKeys[currentIndex - 1] : null;
      const nextDay = currentIndex < dayKeys.length - 1 ? dayKeys[currentIndex + 1] : 'checklist';

      container.innerHTML = `
        <section class="animate-fadeIn">
          <!-- 當日標題與核心統計（已移除跑車路況評級，改為三欄精準統計） -->
          <div class="mb-6">
            <div class="text-xs font-bold tracking-widest uppercase text-champagne mb-1">${data.dayLabel}</div>
            <h2 class="text-xl sm:text-3xl font-black text-white leading-snug">${data.title}</h2>
            <p class="mt-2 text-sm text-slate-400 leading-relaxed">${data.subtitle}</p>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-6">
            ${statsHtml}
          </div>

          <!-- 當日重要提醒橫幅 -->
          <div class="p-4 rounded-2xl border ${alertStyle} mb-8">
            <div class="font-bold text-sm flex items-center gap-2 mb-1">
              <span>${alertIcon}</span>
              <span>${data.alertBanner.title}</span>
            </div>
            <p class="text-xs sm:text-sm opacity-90 whitespace-pre-line leading-relaxed">${data.alertBanner.text}</p>
          </div>

          <!-- 每日精準時間軸 -->
          <div class="mb-10">
            <div class="flex items-center justify-between mb-4">
              <h3 class="text-base sm:text-lg font-bold text-white flex items-center gap-2">
                <span class="w-1.5 h-5 rounded-full bg-champagne"></span>
                <span>當日精準時間軸、地點故事與 IG 打卡美照</span>
              </h3>
              <span class="text-xs text-slate-400">共 ${data.timeline.length} 個節點</span>
            </div>
            <div class="mt-4">
              ${timelineHtml}
            </div>
          </div>

          <!-- 附近可延伸順遊景點與美食 -->
          <div class="pt-6 border-t border-white/10">
            <div class="mb-4">
              <h3 class="text-base sm:text-lg font-bold text-white flex items-center gap-2">
                <span class="w-1.5 h-5 rounded-full bg-cobalt"></span>
                <span>周邊可延伸順遊景點 ＆ 美食備案</span>
              </h3>
              <p class="text-xs text-slate-400 mt-1">若行程進度超前或想彈性微調口味，以下地點皆在當日路線順遊範圍內：</p>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              ${extensionsHtml}
            </div>
          </div>

          <!-- 底部快速換日按鈕 -->
          <div class="mt-10 flex items-center justify-between gap-4">
            ${prevDay ? `
              <button onclick="switchTab('${prevDay}')" class="px-4 py-3 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 text-xs sm:text-sm font-bold text-white transition">
                ← 上一天行程
              </button>
            ` : '<div></div>'}

            <button onclick="switchTab('${nextDay}')" class="px-5 py-3 rounded-xl bg-champagne text-obsidian hover:bg-amber-300 text-xs sm:text-sm font-bold shadow-lg shadow-champagne/20 transition">
              ${nextDay === 'checklist' ? '前往行前裝備檢查清單 →' : '查看下一天行程 →'}
            </button>
          </div>
        </section>
      `;
    }

    function renderChecklist() {
      const container = document.getElementById('app-content');

      // 計算完成進度
      let totalItems = 0;
      let completedCount = 0;
      checklistCategories.forEach(cat => {
        cat.items.forEach(item => {
          totalItems++;
          if (checkedItems[item.id]) completedCount++;
        });
      });
      const progressPct = totalItems > 0 ? Math.round((completedCount / totalItems) * 100) : 0;

      const categoriesHtml = checklistCategories.map(cat => {
        const itemsHtml = cat.items.map(item => {
          const isChecked = !!checkedItems[item.id];
          return `
            <label onclick="toggleCheckItem('${item.id}')" class="flex items-start gap-3 p-3 rounded-xl cursor-pointer transition border ${isChecked ? 'bg-emerald-500/10 border-emerald-500/30 text-slate-400 line-through' : 'bg-obsidian/60 border-white/10 hover:border-champagne/40 text-slate-200'}">
              <div class="mt-0.5 w-5 h-5 rounded-md flex items-center justify-center shrink-0 border ${isChecked ? 'bg-emerald-500 border-emerald-500 text-obsidian font-bold' : 'border-slate-500 bg-transparent'}">
                ${isChecked ? '✓' : ''}
              </div>
              <span class="text-xs sm:text-sm leading-relaxed select-none">${item.text}</span>
            </label>
          `;
        }).join('');

        return `
          <div class="glass-panel rounded-2xl p-5 sm:p-6">
            <h3 class="text-base sm:text-lg font-bold text-white">${cat.title}</h3>
            <p class="text-xs text-slate-400 mt-1 mb-4">${cat.subtitle}</p>
            <div class="space-y-2.5">
              ${itemsHtml}
            </div>
          </div>
        `;
      }).join('');

      container.innerHTML = `
        <section>
          <div class="mb-6">
            <div class="text-xs font-bold tracking-widest uppercase text-champagne mb-1">PRE-TRIP CHECKLIST & SUMMARY</div>
            <h2 class="text-xl sm:text-3xl font-black text-white">行前互動式裝備檢查清單</h2>
            <p class="mt-2 text-sm text-slate-400">出發前逐項點擊確認（自動儲存勾選狀態於瀏覽器中），確保愛車、縮時器材與栗松溫泉裝備萬無一失。</p>
          </div>

          <!-- 準備進度條 -->
          <div class="p-4 sm:p-5 rounded-2xl bg-carbon border border-white/10 mb-6">
            <div class="flex items-center justify-between text-xs sm:text-sm font-bold mb-2">
              <span class="text-white">行前準備完成度</span>
              <span class="text-champagne">${completedCount} / ${totalItems} 項 (${progressPct}%)</span>
            </div>
            <div class="w-full h-2.5 rounded-full bg-obsidian overflow-hidden">
              <div class="h-full bg-gradient-to-r from-champagne to-emerald-400 transition-all duration-300" style="width: ${progressPct}%"></div>
            </div>
          </div>

          <!-- 三大分類清單 -->
          <div class="space-y-6">
            ${categoriesHtml}
          </div>

          <!-- 返回第一天按鈕 -->
          <div class="mt-8 flex justify-start">
            <button onclick="switchTab('day1')" class="px-5 py-3 rounded-xl bg-white/10 hover:bg-champagne hover:text-obsidian text-xs sm:text-sm font-bold text-white transition">
              ← 返回 Day 1 行程總覽
            </button>
          </div>
        </section>
      `;
    }

    // 初始化渲染 Day 1
    window.addEventListener('DOMContentLoaded', () => {
      switchTab('day1');
    });
  </script>
</body>
</html>
